[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-mcp"
version = "1.0.0"
description = "Multi-account Gmail MCP server for Claude Desktop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "keyring>=24.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"
gmail-mcp-setup = "gmail_mcp.setup_cli:main"

[tool.setuptools.packages.find]
include = ["gmail_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
